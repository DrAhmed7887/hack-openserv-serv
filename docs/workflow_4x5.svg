<rect x="40" y="1048" width="1000" height="262" rx="14" fill="#fbf5ea" stroke="#8a5a00" stroke-width="2" stroke-dasharray="10 8"/>
<text x="64" y="1092" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#8a5a00" text-anchor="start">Uncertain only → SERV Reasoning</text>
<text x="64" y="1132" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#1b2430" text-anchor="start">(serv.py → OpenServ API, strict JSON)</text>
<text x="64" y="1172" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#1b2430" text-anchor="start">→ verdict + verbatim quote that</text>
<text x="64" y="1212" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#1b2430" text-anchor="start">names the study type.</text>
<text x="64" y="1252" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#1b2430" text-anchor="start">A person confirms. It never changes the result.</text>
<text x="64" y="1296" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#566273" text-anchor="start">Synthetic data. Rules signed 11 Nov.</text>
