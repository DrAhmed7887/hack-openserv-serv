<rect x="560" y="250" width="480" height="170" rx="14" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text x="580" y="296" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#1b2430" text-anchor="start">1 · Inputs</text><text x="580" y="336" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="400" fill="#1f5f8b" text-anchor="start">inputs.py</text><text x="580" y="374" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#566273" text-anchor="start">schema, bounds, text</text>
