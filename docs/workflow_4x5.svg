<rect width="1080" height="1350" fill="#f6f7f9"/>
<text x="40" y="96" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#1b2430" text-anchor="start">How the audit decides</text>
<text x="40" y="150" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="400" fill="#566273" text-anchor="start">The report reads as finished.</text>
