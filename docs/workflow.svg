<rect width="1600" height="900" fill="#f6f7f9"/>
<text x="60" y="92" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#1b2430" text-anchor="start">How the audit decides</text>
<text x="60" y="140" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="400" fill="#566273" text-anchor="start">Example: synthetic case c07. The report reads as finished; 1 of 6 required assessments is fully supported.</text>
<rect x="60" y="205" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text x="80" y="247" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#1b2430" text-anchor="start">Catalog + case</text><text x="80" y="283" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="400" fill="#1f5f8b" text-anchor="start">catalog.json</text><text x="80" y="317" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#566273" text-anchor="start">synthetic only</text>
<line x1="401" y1="280.0" x2="437" y2="280.0" stroke="#566273" stroke-width="3" marker-end="url(#a)"/>
<rect x="443" y="205" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text x="463" y="247" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#1b2430" text-anchor="start">1 · Inputs</text><text x="463" y="283" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="400" fill="#1f5f8b" text-anchor="start">inputs.py</text><text x="463" y="317" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#566273" text-anchor="start">schema, bounds, text</text>
<line x1="784" y1="280.0" x2="820" y2="280.0" stroke="#566273" stroke-width="3" marker-end="url(#a)"/>
<rect x="826" y="205" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text x="846" y="247" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#1b2430" text-anchor="start">2 · Capability</text><text x="846" y="283" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="400" fill="#1f5f8b" text-anchor="start">catalog.py</text><text x="846" y="317" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#566273" text-anchor="start">quote, hash, negation</text>
<line x1="1167" y1="280.0" x2="1203" y2="280.0" stroke="#566273" stroke-width="3" marker-end="url(#a)"/>
<rect x="1209" y="205" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text x="1229" y="247" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#1b2430" text-anchor="start">3 · Calls</text><text x="1229" y="283" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="400" fill="#1f5f8b" text-anchor="start">calls.py</text><text x="1229" y="317" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#566273" text-anchor="start">tool, study, arg values</text>
<rect x="60" y="425" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text x="80" y="467" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#1b2430" text-anchor="start">4 · Receipts</text><text x="80" y="503" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="400" fill="#1f5f8b" text-anchor="start">receipts.py</text><text x="80" y="537" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#566273" text-anchor="start">executor, sha256, status</text>
<line x1="401" y1="500.0" x2="437" y2="500.0" stroke="#566273" stroke-width="3" marker-end="url(#a)"/>
<rect x="443" y="425" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text x="463" y="467" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#1b2430" text-anchor="start">5 · Coverage</text><text x="463" y="503" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="400" fill="#1f5f8b" text-anchor="start">coverage.py</text><text x="463" y="537" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#566273" text-anchor="start">4 dispositions</text>
<line x1="784" y1="500.0" x2="820" y2="500.0" stroke="#566273" stroke-width="3" marker-end="url(#a)"/>
<rect x="826" y="425" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text x="846" y="467" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#1b2430" text-anchor="start">6 · Report</text><text x="846" y="503" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="400" fill="#1f5f8b" text-anchor="start">reconcile.py</text><text x="846" y="537" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#566273" text-anchor="start">claims need receipts</text>
<line x1="1167" y1="500.0" x2="1203" y2="500.0" stroke="#566273" stroke-width="3" marker-end="url(#a)"/>
<rect x="1209" y="425" width="335" height="150" rx="14" fill="#ffffff" stroke="#1f5f8b" stroke-width="2"/><text x="1229" y="467" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#1b2430" text-anchor="start">Audit JSON</text><text x="1229" y="503" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="400" fill="#1f5f8b" text-anchor="start">audit.py</text><text x="1229" y="537" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#566273" text-anchor="start">full support or gaps</text>
<path d="M1376.5,359 V391 H227.5 V417" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="668" width="1480" height="150" rx="14" fill="#fbf5ea" stroke="#8a5a00" stroke-width="2" stroke-dasharray="10 8"/>
<text x="84" y="712" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="600" fill="#8a5a00" text-anchor="start">Uncertain only → SERV Reasoning (serv.py → OpenServ inference API, strict JSON) → advice:</text>
<text x="84" y="752" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="400" fill="#1b2430" text-anchor="start">a verdict and a verbatim quote that names the study type. A person confirms; it never changes the result.</text>
<text x="84" y="792" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#566273" text-anchor="start">Human: the engineer acts on each gap. Physician/operator sign-off on obligations: pending.</text>
<line x1="610.5" y1="579" x2="610.5" y2="662" stroke="#8a5a00" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#w)"/>
<line x1="1376.5" y1="662" x2="1376.5" y2="581" stroke="#8a5a00" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#w)"/>
<text x="1390.5" y="652" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#8a5a00" text-anchor="start">advice only</text>
<text x="60" y="628" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="600" fill="#1d6b43" text-anchor="start" stroke="#f6f7f9" stroke-width="12" stroke-linejoin="round" paint-order="stroke">Full support only when the mapping is confirmed, the call is valid and its receipt checks out.</text>
<text x="1540" y="870" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#566273" text-anchor="end">Synthetic data and a fictional catalog. No images, no patients.</text>
</svg>
